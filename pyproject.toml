[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drap-model"
version = "0.2.0"
description = "Regime-aware dual-timescale rule memory for DRAP recommendation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0", "tqdm>=4.66"]
dev = ["pytest>=8.0"]

[project.scripts]
drap = "drap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drap = ["resources/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
